[package]
name = "inbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
base64 = "0.22"
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
